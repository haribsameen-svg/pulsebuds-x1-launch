<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact & Pre-order - PulseBuds X1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="features.html">Features</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <h1>Contact & Pre-order</h1>
  
  <div class="card">
    <form id="preorderForm" onsubmit="submitForm(event)">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
      </div>
      
      <div class="form-group">
        <label for="pack">Select Pack:</label>
        <select id="pack" name="pack">
          <option value="Standard">Standard - Rs. 7,999</option>
          <option value="Plus">Plus - Rs. 9,499</option>
          <option value="Pro">Pro - Rs. 11,999</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4"></textarea>
      </div>
      
      <button type="submit">Submit Pre-order</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 PulseBuds X1 &ndash; Harib Sameen</p>
  </footer>

  <script>
    function submitForm(event) {
      // Prevent the page from refreshing when the form is submitted
      event.preventDefault(); 
      
      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let pack = document.getElementById("pack").value;
      let message = document.getElementById("message").value.trim();
      
      if (name === "" || email === "") {
        window.alert("Submission failed: Please provide both your name and email address.");
        return; 
      }
      
      console.log("--- New Pre-order Submission ---");
      console.log("Name: " + name);
      console.log("Email: " + email);
      console.log("Pack Selected: " + pack);
      console.log("Message: " + message);
      
      window.alert("Thank you, " + name + "! Your request for the " + pack + " pack has been logged.");
      
      // Clears the form fields after successful submission
      document.getElementById("preorderForm").reset();
    }
  </script>
</body>
</html>
